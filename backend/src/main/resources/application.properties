spring.application.name = backend
spring.datasource.url = ${SPRING_DATASOURCE_URL}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.defer-datasource-initialization = true
spring.sql.init.mode = always
spring.jpa.show-sql = false

# Reponses d erreur : on garde les defauts de production meme en dev.
# spring-boot-devtools force sinon include-message et include-stacktrace a
# "always", ce qui renvoie le message d exception et la stacktrace complete
# au client des que le dispatch ERROR est autorise dans SecurityConfig.
# Prefixe spring.web.error : server.error.* est deprecie depuis Boot 4.1 et
# n est plus lu sans spring-boot-properties-migrator.
spring.web.error.include-message = never
spring.web.error.include-stacktrace = never
spring.web.error.include-binding-errors = never
server.port = 8080
jwt.secret = ${JWT_SECRET}
jwt.refresh-token-validity-days = 7

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

app.avatar.storage-dir=uploads/avatars
app.avatar.public-path=/api/avatars
app.avatar.max-size-bytes=2097152

app.chess.disconnect-grace-seconds=60
app.chess.forfeit-sweep-ms=300000
spring.task.scheduling.pool.size=4

app.oauth42.client-id=${OAUTH42_CLIENT_ID}
app.oauth42.client-secret=${OAUTH42_CLIENT_SECRET}
app.oauth42.redirect-uri=${OAUTH42_REDIRECT_URI}
app.oauth42.authorize-uri=https://api.intra.42.fr/oauth/authorize
app.oauth42.token-uri=https://api.intra.42.fr/oauth/token
app.oauth42.user-info-uri=https://api.intra.42.fr/v2/me
app.oauth42.frontend-redirect-uri=${OAUTH42_FRONTEND_REDIRECT_URI:https://localhost/}

app.frontend-origin=${FRONTEND_ORIGIN:https://localhost}